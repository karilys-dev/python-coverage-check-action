name: 'My Plugin'
description: 'Creates a check run'
inputs:
  working-directory:
    required: false
    default: "."
runs:
  using: 'composite'
  steps:
    - name: Create check run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        REPORT_PATH="${{ inputs.working-directory }}"

        if [ ! -d "$REPORT_PATH" ]; then
          echo "Report directory not found: $REPORT_PATH"
          exit 1
        fi
        cd "${{ inputs.working-directory }}"
        REPORT_CONTENT=$(coverage report)

        MARKDOWN=$(printf "### Coverage Report\n\n\`\`\`\n%s\n\`\`\`" "$REPORT_CONTENT")

        echo "github.sha: ${{ github.sha }}"
        echo "pr.head.sha: ${{ github.event.pull_request.head.sha }}"
        
        curl -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/check-runs \
          -d @- <<EOF
        {
          "name": "myplugin",
          "head_sha": "${{ github.event.pull_request.head.sha }}",
          "status": "completed",
          "conclusion": "success",
          "output": {
            "title": "Coverage Report",
            "summary": "Coverage report attached",
            "text": $MARKDOWN
          }
        }
        EOF
