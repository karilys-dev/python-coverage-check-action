name: 'My Plugin'
description: 'Creates a check run'

inputs:
  working-directory:
    required: false
    default: "."

runs:
  using: 'composite'
  steps:
    - name: Create check run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -e

        REPORT_PATH="${{ inputs.working-directory }}"

        if [ ! -d "$REPORT_PATH" ]; then
          echo "Report directory not found: $REPORT_PATH"
          exit 1
        fi

        cd "$REPORT_PATH"

        MARKDOWN=$(coverage report --format=markdown)
        TEXT=$(jq -Rs . <<< "$MARKDOWN")

        curl -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/check-runs \
          -d @- <<EOF
        {
          "name": "Python Coverage Report",
          "head_sha": "${{ github.event.pull_request.head.sha }}",
          "status": "completed",
          "conclusion": "success",
          "output": {
            "title": "Coverage Report",
            "summary": "Coverage report attached",
            "text": $TEXT
          }
        }
        EOF