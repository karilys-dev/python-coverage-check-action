name: 'My Plugin'
description: 'Creates a check run'

inputs:
  working-directory:
    required: false
    default: "."

runs:
  using: 'composite'
  steps:
    - name: Create check run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -e

        REPORT_PATH="${{ inputs.working-directory }}"

        if [ ! -d "$REPORT_PATH" ]; then
          echo "Report directory not found: $REPORT_PATH"
          exit 1
        fi

        cd "$REPORT_PATH"

        REPORT_CONTENT=$(coverage report --format=text)

        # Build table header
        TABLE="| File | Stmts | Miss | Cover |\n"
        TABLE+="|------|-------|------|-------|\n"

        # Avoid subshell by using process substitution
        while IFS= read -r line; do
          FILE=$(echo "$line" | awk '{print $1}')
          STMTS=$(echo "$line" | awk '{print $2}')
          MISS=$(echo "$line" | awk '{print $3}')
          COVER=$(echo "$line" | awk '{print $4}')

          TABLE+="| $FILE | $STMTS | $MISS | $COVER |\n"
        done < <(echo "$REPORT_CONTENT" | tail -n +3)

        # Optional: wrap in markdown section
        MARKDOWN=$(printf "### Coverage Report\n\n%s" "$TABLE")

        # Convert to JSON-safe string
        TEXT=$(jq -Rs . <<< "$MARKDOWN")

        curl -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/check-runs \
          -d @- <<EOF
        {
          "name": "Python Coverage Report",
          "head_sha": "${{ github.event.pull_request.head.sha }}",
          "status": "completed",
          "conclusion": "success",
          "output": {
            "title": "Coverage Report",
            "summary": "Coverage report attached",
            "text": $TEXT
          }
        }
        EOF