name: "Python Coverage Check"
description: "Publish coverage CLI table to PR checks"

inputs:
  working-directory:
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Generate coverage report
      id: coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        REPORT=$(coverage report)
        echo "$REPORT"

        # Save as multiline output for next step
        echo "report<<EOF" >> $GITHUB_OUTPUT
        echo "$REPORT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Publish styled coverage report
      uses: actions/github-script@v7
      with:
        script: |
          const raw = `${{ steps.coverage.outputs.report }}`;

          const lines = raw.split('\n').filter(l => l.trim() !== '');

          // Remove separator lines (----)
          const clean = lines.filter(l => !l.includes('---'));

          // Extract header + rows
          const header = clean[0].split(/\s{2,}/);
          const rows = clean.slice(1).map(line => line.split(/\s{2,}/));

          // Build markdown table
          let table = '| ' + header.join(' | ') + ' |\n';
          table += '| ' + header.map(() => '---').join(' | ') + ' |\n';

          for (const row of rows) {
            table += '| ' + row.join(' | ') + ' |\n';
          }

          // Extract TOTAL coverage
          const totalLine = rows.find(r => r[0] === 'TOTAL');
          const totalCoverage = totalLine ? totalLine[3] : 'N/A';

          const sha = context.payload.pull_request?.head?.sha;

          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: "Python coverage",
            head_sha: sha,
            status: "completed",
            conclusion: "success",
            output: {
              title: `Python Coverage (${totalCoverage})`,
              summary: `
          ### 📊 Coverage Summary

          **Total Coverage: ${totalCoverage}**

          <details>
          <summary>View full report</summary>

          ${table}

          </details>
          `,
                    text: table
                  }
                });