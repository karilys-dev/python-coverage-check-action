name: 'My Plugin'
description: 'Creates a check run'

runs:
  using: 'composite'
  steps:
    - name: Create check run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        curl -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/check-runs \
          -d @- <<EOF
        {
          "name": "myplugin",
          "head_sha": "${{ github.sha }}",
          "status": "completed",
          "conclusion": "success",
          "output": {
            "title": "myplugin",
            "summary": "hello this is my first custom plugin"
          }
        }
        EOF