name: 'My Plugin'
description: 'Creates a check run'
inputs:
  working-directory:
    required: false
    default: "."
runs:
  using: 'composite'
  steps:
    - name: Create check run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        REPORT_PATH="${{ inputs.working-directory }}"

        if [ ! -d "$REPORT_PATH" ]; then
          echo "Report directory not found: $REPORT_PATH"
          exit 1
        fi
        cd "${{ inputs.working-directory }}"
        REPORT_CONTENT=$(coverage report --format=text)

        TABLE="| File | Stmts | Miss | Cover |\n|------|-------|------|-------|\n"
        echo "$REPORT_CONTENT" | tail -n +3 | while read -r line; do
          FILE=$(echo "$line" | awk '{print $1}')
          STMTS=$(echo "$line" | awk '{print $2}')
          MISS=$(echo "$line" | awk '{print $3}')
          COVER=$(echo "$line" | awk '{print $4}')

          TABLE="${TABLE}| $FILE | $STMTS | $MISS | $COVER |\n"
        done
        MARKDOWN=$(printf "### Coverage Report\n\n%s" "$TABLE")
        TEXT=$(jq -Rs . <<< "$MARKDOWN")

        curl -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/check-runs \
          -d @- <<EOF
        {
          "name": "myplugin",
          "head_sha": "${{ github.event.pull_request.head.sha }}",
          "status": "completed",
          "conclusion": "success",
          "output": {
            "title": "Coverage Report",
            "summary": "Coverage report attached",
            "text": $TEXT
          }
        }
        EOF
