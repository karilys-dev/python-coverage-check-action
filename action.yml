name: 'My Plugin'
description: 'Creates a coverage check run'

inputs:
  working-directory:
    required: false
    default: "."
  coverage-threshold:
    required: false
    default: "80"

runs:
  using: 'composite'
  steps:
    - name: Create check run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -eEuo pipefail

        # Extract threshold from pyproject.toml
        THRESHOLD=$(python - <<'EOF'
        import re

        with open("pyproject.toml", "r") as f:
            content = f.read()

        match = re.search(r"--cov-fail-under=(\d+)", content)
        print(match.group(1) if match else "")
        EOF
        )


        echo "Threshold: $THRESHOLD"


        # Get markdown coverage output
        REPORT_CONTENT=$(coverage report --format=markdown)
        
        echo "==== RAW COVERAGE OUTPUT ===="
        echo "$REPORT_CONTENT"
        echo "============================="

        # Extract TOTAL coverage from markdown table
        TOTAL_COVER=$(echo "$REPORT_CONTENT" \
          | grep -E '\|\s*\*\*TOTAL\*\*\s*\|' \
          | sed 's/\*\*//g' \
          | awk -F'|' '{gsub(/ /,"",$5); print $5}' \
          | tr -d '%')
        
        # Add badge
        BADGE_COLOR="red"

        if [ "$TOTAL_COVER" -ge 90 ]; then
          BADGE_COLOR="brightgreen"
        elif [ "$TOTAL_COVER" -ge 75 ]; then
          BADGE_COLOR="yellow"
        elif [ "$TOTAL_COVER" -ge 50 ]; then
          BADGE_COLOR="orange"
        fi

        BADGE_URL="https://img.shields.io/badge/coverage-${TOTAL_COVER}%25-${BADGE_COLOR}"

        # Fail fast if parsing broke
        if [ -z "$TOTAL_COVER" ]; then
          echo "❌ Failed to parse total coverage"
          exit 1
        fi

        echo "Parsed total coverage: $TOTAL_COVER%"

        # Determine pass/fail
        if [[ -z "$TOTAL_COVER" || -z "$THRESHOLD" ]]; then
          echo "❌ Missing numeric values"
          echo "TOTAL_COVER=$TOTAL_COVER"
          echo "THRESHOLD=$THRESHOLD"
          exit 1
        fi
        SUMMARY_MD="![Coverage](${BADGE_URL})  **${TOTAL_COVER}%** (threshold: ${THRESHOLD}%)"$'\n\n'
        SUMMARY=$(jq -Rs . <<< "$SUMMARY_MD")

        if [ "$TOTAL_COVER" -lt "$THRESHOLD" ]; then
          CONCLUSION="failure"
          # SUMMARY+="❌ Coverage below required threshold"
        else
          CONCLUSION="success"
          # SUMMARY+="✅ Coverage meets requirement"
        fi

        SUMMARY=$(jq -Rs . <<< "$SUMMARY")
        TEXT=$(jq -Rs . <<< "$REPORT_CONTENT")
        # Create check run
        curl -s -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/check-runs \
          -d @- <<EOF
        {
          "name": "Python Coverage Report",
          "head_sha": "${{ github.event.pull_request.head.sha }}",
          "status": "completed",
          "conclusion": "${CONCLUSION}",
          "output": {
            "title": "Coverage Report",
            "summary": "${SUMMARY}",
            "text": $TEXT
          }
        }
        EOF

        # Also fail the job if coverage is below threshold
        if [ "$CONCLUSION" = "failure" ]; then
          echo "❌ Failing job due to low coverage"
          exit 1
        fi