name: "Python Coverage Check"
description: "Publish coverage CLI table to PR checks"

inputs:
  working-directory:
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Generate coverage report
      id: coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        REPORT=$(coverage report)
        echo "$REPORT"

        # Save as multiline output for next step
        echo "report<<EOF" >> $GITHUB_OUTPUT
        echo "$REPORT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Publish Coverage Report
      uses: actions/github-script@v7
      with:
        script: |
          const raw = `${{ steps.coverage.outputs.report }}`;

          const sha = context.payload.pull_request?.head?.sha;
          if (!sha) {
            core.setFailed("No PR context found");
            return;
          }

          // STEP 1: Create check run (in_progress)
          const create = await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: "Python Coverage",
            head_sha: sha,
            status: "in_progress"
          });

          const check_run_id = create.data.id;

          // STEP 2: Format output (simple for now)
          const text = "```\n" + raw + "\n```";

          // STEP 3: Update check run (completed)
          await github.rest.checks.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            check_run_id,
            status: "completed",
            conclusion: "success",
            output: {
              title: "Python Coverage",
              summary: "Coverage report from pytest",
              text: text
            }
          });

          console.log("Check run created + updated:", check_run_id);