name: 'My Plugin'
description: 'Creates a coverage check run'

inputs:
  working-directory:
    required: false
    default: "."
  coverage-threshold:
    required: false
    default: "80"

runs:
  using: 'composite'
  steps:
    - name: Create check run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -eEuo pipefail

        REPORT_PATH="${{ inputs.working-directory }}"
        THRESHOLD="${{ inputs.coverage-threshold }}"

        echo "Working directory: $REPORT_PATH"
        echo "Threshold: $THRESHOLD"

        if [ ! -d "$REPORT_PATH" ]; then
          echo "Report directory not found: $REPORT_PATH"
          exit 1
        fi

        cd "$REPORT_PATH"

        # Get markdown coverage output
        REPORT_CONTENT=$(coverage report --format=markdown)
        TEXT=$(jq -Rs . <<< "$REPORT_CONTENT")
        echo "==== RAW COVERAGE OUTPUT ===="
        echo "$REPORT_CONTENT"
        echo "============================="

        # Extract TOTAL coverage from markdown table
        TOTAL_COVER=$(echo "$REPORT_CONTENT" \
          | grep -E '\|\s*TOTAL\s*\|' \
          | awk -F'|' '{gsub(/ /,"",$5); print $5}' \
          | tr -d '%')

        # Fail fast if parsing broke
        if [ -z "$TOTAL_COVER" ]; then
          echo "❌ Failed to parse total coverage"
          exit 1
        fi

        echo "Parsed total coverage: $TOTAL_COVER%"

        # Determine pass/fail
        if [ "$TOTAL_COVER" -lt "$THRESHOLD" ]; then
          CONCLUSION="failure"
          SUMMARY="❌ Coverage $TOTAL_COVER% is below threshold $THRESHOLD%"
        else
          CONCLUSION="success"
          SUMMARY="✅ Coverage $TOTAL_COVER% meets threshold $THRESHOLD%"
        fi

        # Create check run
        curl -s -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/check-runs \
          -d @- <<EOF
        {
          "name": "Python Coverage Report",
          "head_sha": "${{ github.event.pull_request.head.sha }}",
          "status": "completed",
          "conclusion": "${CONCLUSION}",
          "output": {
            "title": "Coverage Report",
            "summary": "${SUMMARY}",
            "text": $TEXT
          }
        }
        EOF

        # Also fail the job if coverage is below threshold
        if [ "$CONCLUSION" = "failure" ]; then
          echo "❌ Failing job due to low coverage"
          exit 1
        fi